# ============================================================================
# INTERN & AI AGENT GUIDE — WHAT IS THIS FILE?
# ============================================================================
# File: backend/src/main/resources/application.yml
# Purpose: Central configuration for the Mastek Pulse Spring Boot 3.3+ API.
# Key Architectural Highlights for 10,000+ Users:
#   1. `spring.threads.virtual.enabled: true` activates Java 21 Virtual Threads
#      (Project Loom) for high-concurrency commute traffic.
#   2. By default, runs in PostgreSQL-compatible embedded mode (`jdbc:h2:mem:...;MODE=PostgreSQL`)
#      so any Hackathon developer or AI agent can run `mvn spring-boot:run`
#      instantly without Docker setup friction.
#   3. Activate `-Dspring.profiles.active=postgres` to connect to the live
#      PostgreSQL 16 container from `docker-compose.yml`.
# ============================================================================

server:
  port: 8080

spring:
  application:
    name: mastek-pulse-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:mastek_pulse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: pulse_app
    password: pulse_dev_password
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=5m

pulse:
  ai:
    action-cap: 720
    alert-threshold-50: 360
    alert-threshold-80: 576
    enabled: true
  media:
    signed-url-ttl-seconds: 900

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

---
# Profile: postgres (Used when running against Docker PostgreSQL 16 or Enterprise Managed DB)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mastek_pulse}
    username: ${POSTGRES_USER:pulse_app}
    password: ${POSTGRES_PASSWORD:pulse_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
